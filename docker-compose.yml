# Local backend only; clients run separately (see README.md).
# Optional overrides: copy .env.example to .env.
# Start: docker compose up --build
# Alongside web: BACKEND_PORT=4000 docker compose up --build
# All backend data is in memory and is lost on restart.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: issue-gate-backend:local
    container_name: issue-gate-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      CHANGE_FEED_PAGE_SIZE: ${CHANGE_FEED_PAGE_SIZE:-50}
      CHANGE_FEED_RETENTION: ${CHANGE_FEED_RETENTION:-1000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 128M
