name: issue_gate_mobile
description: Flutter mobile client for the Issue Gate zero-knowledge secret manager (MSM mobile stories).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  connectivity_plus: ^6.1.0
  local_auth: ^2.3.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
